minimum_pre_commit_version: "3.7.0"

repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v1.64.8
    hooks:
      - id: golangci-lint
        entry: bash -lc 'cd backend && golangci-lint run --timeout=5m ./...'
        pass_filenames: false
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: backend-govulncheck
        name: backend govulncheck
        entry: bash -lc 'cd backend && govulncheck ./...'
        language: system
        pass_filenames: false
        files: ^backend/

      - id: trivy-fs
        name: trivy filesystem scan
        entry: trivy fs --severity CRITICAL,HIGH --ignore-unfixed .
        language: system
        pass_filenames: false

      - id: frontend-eslint
        name: frontend eslint (bun)
        entry: bun --cwd frontend run lint
        language: system
        pass_filenames: false

      - id: frontend-tsc
        name: frontend tsc --noEmit (bun)
        entry: bun --cwd frontend run typecheck
        language: system
        pass_filenames: false

