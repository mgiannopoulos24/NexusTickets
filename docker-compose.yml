name: nexustickets

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexustickets}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev_password_change_me}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-nexustickets}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-nexustickets_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-nexus_app_dev_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Provisions the dedicated app role (nexustickets_app) on first init.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - >
        exec redis-server
        --appendonly yes
        --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password_change_me}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  backend:
    build:
      context: ./backend
    environment:
      APP_PORT: ${APP_PORT:-8080}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/etc/tls/cert.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/etc/tls/key.pem}
      # DB / Redis placeholders (used as the backend grows).
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-nexustickets}}
      DB_USER: ${DB_USER:-${POSTGRES_APP_USER:-nexustickets_app}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_APP_PASSWORD:-nexus_app_dev_password_change_me}}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password_change_me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nexustickets.local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # TLS_CERT_FILE / TLS_KEY_FILE above point here. The backend speaks TLS on
      # its own port, so the nginx -> backend hop inside the network is encrypted
      # too, not just the browser -> nginx one.
      - ./docker/tls/local:/etc/tls:ro
    healthcheck:
      # The backend serves TLS, so the probe must too. The certificate is for
      # `localhost` and self-signed, hence --no-check-certificate on a loopback
      # request that never leaves the container.
      test: ["CMD", "/nexustickets-api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 20
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_WS_URL: ""
    depends_on:
      - backend
    ports:
      - "80:5173"
      - "443:443"
    volumes:
      - ./docker/tls/local:/etc/nginx/ssl:ro
    networks:
      - app

volumes:
  postgres_data:
  redis_data:

networks:
  app:
    driver: bridge
