name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · gofmt, vet, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The service-layer tests talk to a real Redis (tokens, unread counters,
    # rate limiting). Postgres is not needed: repositories are faked in tests.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: wire is up to date
        run: |
          go run github.com/google/wire/cmd/wire ./internal/wire/
          git diff --exit-code -- internal/wire/wire_gen.go

      - name: go test
        run: go test ./... -count=1
        env:
          # The service tests read this; REDIS_HOST is left unset on purpose
          # because the config tests assert its default.
          TEST_REDIS_ADDR: localhost:6379

  frontend:
    name: frontend · tsc, eslint, vitest, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: tsc --noEmit
        run: bun run typecheck

      - name: eslint
        run: bun run lint

      - name: vitest
        run: bun run test

      - name: vite build
        run: bun run build

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
