name: test

on:
  # pull_request:
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexustickets_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: backend/go.sum

      - name: go test (without DB)
        run: go test -short ./...

      - name: go test (with DB)
        run: go test ./...
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: nexustickets_test
          DB_USER: test
          DB_PASSWORD: test
