services:
  postgres:
    ports:
      - "${POSTGRES_EXPOSED_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"

  backend:
    build:
      # Dev needs Go tooling (air, go build); builder stage = golang:1.22-alpine.
      target: builder
    # Runs as root in dev to avoid volume permission issues with Go caches.
    working_dir: /app
    environment:
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/etc/tls/cert.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/etc/tls/key.pem}
    volumes:
      - ./backend:/app
      - ./docker/tls/local:/etc/tls:ro
      - backend_go_cache:/go/pkg/mod
      - backend_go_build_cache:/root/.cache/go-build
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    command:
      - sh
      - -c
      - >
        go install github.com/cosmtrek/air@v1.49.0 &&
        air -c .air.toml

  frontend:
    build:
      context: ./frontend
      target: builder
    environment:
      VITE_API_PROXY_TARGET: https://backend:8080
      VITE_HMR_CLIENT_PORT: ${FRONTEND_PORT:-5173}
    volumes:
      - ./frontend:/app
      - frontend_bun_cache:/root/.bun
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command:
      - sh
      - -c
      - >
        bun install &&
        bun run dev --host 0.0.0.0 --port 5173

  seed:
    build:
      context: ./backend
      target: builder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-nexustickets}}
      DB_USER: ${DB_USER:-${POSTGRES_APP_USER:-nexustickets_app}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_APP_PASSWORD:-nexus_app_dev_password_change_me}}
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_go_cache:/go/pkg/mod
      - backend_go_build_cache:/root/.cache/go-build
    command:
      - sh
      - -c
      - go run ./cmd/seed

volumes:
  backend_go_cache:
  backend_go_build_cache:
  frontend_bun_cache:
