services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexustickets}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev_password_change_me}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-nexustickets}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-nexustickets_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-nexus_app_dev_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Provisions the dedicated app role (nexustickets_app) on first init.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_EXPOSED_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - >
        exec redis-server
        --appendonly yes
        --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password_change_me}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"

  backend:
    build:
      # Dev needs Go tooling (air, go build); builder stage = golang:1.22-alpine.
      target: builder
    # Runs as root in dev to avoid volume permission issues with Go caches.
    working_dir: /app
    environment:
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/etc/tls/cert.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/etc/tls/key.pem}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-nexustickets}}
      DB_USER: ${DB_USER:-${POSTGRES_APP_USER:-nexustickets_app}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_APP_PASSWORD:-nexus_app_dev_password_change_me}}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password_change_me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nexustickets.local}
    volumes:
      - ./backend:/app
      - ./docker/tls/local:/etc/tls:ro
      - backend_go_cache:/go/pkg/mod
      - backend_go_build_cache:/root/.cache/go-build
    ports: !override
      - "${APP_PORT:-8080}:8080"
    # The builder image has busybox at the usual path (no /busybox as in the
    # scratch image) and the dev server speaks TLS with the local cert.
    healthcheck:
      test:
        ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    command:
      - sh
      - -c
      - >
        go install github.com/cosmtrek/air@v1.49.0 &&
        air -c .air.toml

  frontend:
    build:
      context: ./frontend
      target: builder
    environment:
      # Vite terminates TLS itself with the local mkcert cert, so the browser
      # opens https://localhost:5173 and everything (REST, uploads, the realtime
      # WebSocket) rides Vite's proxy to the TLS backend on the same origin.
      VITE_TLS_CERT_FILE: /etc/tls/cert.pem
      VITE_TLS_KEY_FILE: /etc/tls/key.pem
      VITE_API_PROXY_TARGET: https://backend:8080
      VITE_HMR_CLIENT_PORT: ${FRONTEND_PORT:-5173}
      # Empty = same-origin wss://localhost:5173/api/v1/ws/messages.
      VITE_WS_URL: ""
    volumes:
      - ./frontend:/app
      - ./docker/tls/local:/etc/tls:ro
      - frontend_bun_cache:/root/.bun
    ports: !override
      - "${FRONTEND_PORT:-5173}:5173"
    command:
      - sh
      - -c
      - >
        bun install &&
        node node_modules/vite/bin/vite.js --host 0.0.0.0 --port 5173

  seed:
    build:
      context: ./backend
      target: builder
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-nexustickets}}
      DB_USER: ${DB_USER:-${POSTGRES_APP_USER:-nexustickets_app}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_APP_PASSWORD:-nexus_app_dev_password_change_me}}
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_go_cache:/go/pkg/mod
      - backend_go_build_cache:/root/.cache/go-build
    command:
      - sh
      - -c
      - go run ./cmd/seed

volumes:
  postgres_data:
  backend_go_cache:
  backend_go_build_cache:
  frontend_bun_cache:
